<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>KFC Signup Form</title>
    <link rel="stylesheet" href="kfcform.css">
</head>
<body>

    <div class="container">
        <h2 class="title">Sign In / Sign Up</h2>

        <h1 class="logo">KFC</h1>

        <p class="subtitle">
            LET'S SIGN IN OR CREATE ACCOUNT WITH YOUR PHONE NUMBER!
        </p>

        <form>

            <!-- Name -->
            <label>Name</label>
            <input type="text" placeholder="Enter your name" required>

            <!-- Email -->
            <label>Email</label>
            <input type="email" placeholder="Enter your email" required>

            <!-- Phone Number -->
            <label>Phone Number</label>
            <input type="text" placeholder="Enter phone number" required>

            <!-- Password -->
            <label>Password</label>
            <input type="password" placeholder="Enter password" required>

            <!-- Confirm Password -->
            <label>Confirm Password</label>
            <input type="password" placeholder="Confirm password" required>

            <!-- Submit -->
            <button type="submit" class="btn-submit">Create Account</button>

        </form>

        <p class="or-text">OR</p>

        <button class="btn-guest">Skip, Continue As Guest</button>
    </div>

</body>
</html>
