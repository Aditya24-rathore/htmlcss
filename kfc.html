<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>KFC Menu Grid</title>
  <link rel="stylesheet" href="kfc.css">
</head>
<body>

  <h2 class="title">Epic Bucket of the Day</h2>

  <div class="menu-grid">
    <div class="menu-item">
      <img src="bucket.jpg" alt="Chicken Bucket">
      <h3>Chicken Buckets</h3>
    </div>

    <div class="menu-item">
      <img src="burger.jpg" alt="Burgers">
      <h3>Burgers</h3>
    </div>

    <div class="menu-item">
      <img src="snacks.jpg" alt="Snacks">
      <h3>Snacks</h3>
    </div>

    <div class="menu-item">
      <img src="ricebowl.jpg" alt="Rice Bowlz">
      <h3>Rice Bowlz</h3>
    </div>

    <div class="menu-item">
      <img src="variety.jpg" alt="Variety Buckets">
      <h3>Variety Buckets</h3>
    </div>

    <div class="menu-item">
      <img src="beverages.jpg" alt="Beverage & Desserts">
      <h3>Beverage & Desserts</h3>
    </div>
  </div>

</body>
</html>
